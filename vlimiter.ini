# VLimiter - config
# Lives next to VLimiter.asi. Use the in-game menu (menu key) and Save,
# or edit this file and press the reload key / restart the game.

# enabled: master switch. 0 = frames pass through untouched.
enabled = 1

# fps_limit: frames per second while the game window has focus. 0 = no
# limit. The game's own VSync setting still applies on top: with VSync on
# you get whichever of the two is lower.
fps_limit = 60
# background_fps: limit while another window has focus (alt-tabbed, on a
# second monitor). 0 = same as fps_limit. FiveM itself already holds a
# minimised game to 30.
background_fps = 30

# spin_margin_us: each wait is a timer sleep followed by a short spin for
# the last spin_margin_us microseconds, which is what makes the cap
# precise. Larger = steadier frame times, slightly more CPU on one core;
# 0 = sleep only (lowest CPU, frame times wobble by up to a millisecond).
spin_margin_us = 1000

# update_check: once at startup, ask api.github.com for the latest release
# and show a notice in the menu if it is newer. Nothing is downloaded or
# installed, nothing else is sent. 0 = never contact anything.
update_check = 1

# Hotkeys: F1-F24, or a hex/decimal virtual-key code. 0 disables.
# menu_key toggles the in-game menu. toggle_key switches the limiter on and
# off. reload_key re-reads this file. F8 is FiveM's console and F1-F3 the
# Rockstar Editor, so avoid those.
menu_key = F4
toggle_key = 0x0
reload_key = 0x0

# debug: write a frame-pacing summary (fps, frame time, wait time, hook
# calls) to vlimiter.log every few seconds. Leave at 0 unless investigating.
debug = 0
